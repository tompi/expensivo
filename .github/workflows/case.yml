name: Case STLs

# Renders every printable case part, checks it and uploads them as the "case-stl" artifact.
on:
  push:
    paths:
      - "case/**"
      - "scripts/render_case.py"
      - ".github/workflows/case.yml"
  pull_request:
    paths:
      - "case/**"
      - "scripts/render_case.py"
      - ".github/workflows/case.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install numpy trimesh shapely manifold3d scipy networkx
          docker pull -q openscad/openscad:dev

      - name: Render and check STLs
        run: |
          python scripts/render_case.py -o stl \
            --openscad "docker run --rm --user $(id -u):$(id -g) -v $PWD:/work -w /work openscad/openscad:dev openscad"

      - uses: actions/upload-artifact@v4
        with:
          name: case-stl
          path: stl/*.stl
          if-no-files-found: error

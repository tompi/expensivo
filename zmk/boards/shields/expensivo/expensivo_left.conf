# Left half only: Zephyr reads <shield>.conf, so a plain expensivo.conf is never used.
# Pointing and battery proxy are central-side features.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_POINTING=y
# Deep sleep after 15 min idle; wake with a key on this half
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
